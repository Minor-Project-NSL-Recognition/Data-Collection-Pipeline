name: nsl_app
description: "Nepali Sign Language emergency-phrase recognition client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.0+2           # image stream -> raw frames
  web_socket_channel: ^3.0.1  # /ws/stream (server mode only)
  image: ^4.3.0               # YUV420 -> JPEG (server mode only)
  tflite_flutter: ^0.11.0     # on-device BiLSTM — the offline path
  just_audio: ^0.9.42         # plays the pre-recorded Nepali phrase
  audio_session: ^0.1.21      # so it is audible with iOS's ringer switch muted
  shared_preferences: ^2.3.3  # remembers the server URL between runs

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Phrase wording in English and Nepali. Hand-authored, and THE source both
    # languages read -- nslr/config.py loads this exact file, so editing it is
    # the only way to change a label anywhere in the project.
    - assets/phrases.json
    # Everything the offline path needs. ~18 MB, dominated by the two MediaPipe
    # bundles; regenerate the three model files with:
    #   python scripts/train_model.py && python scripts/export_tflite.py
    #   cp results/{model.tflite,ood.json,model_meta.json} app/assets/models/
    - assets/models/model.tflite               # BiLSTM: softmax + 32-d embedding
    - assets/models/model_meta.json            # class_names, seq_len, thresholds
    - assets/models/ood.json                   # Mahalanobis prototypes + threshold
    - assets/models/pose_landmarker_full.task  # 33 pose landmarks
    - assets/models/hand_landmarker.task       # 21 landmarks per hand
    # One 48 kHz mono WAV per phrase, ~1.4 MB total, named by class key so the
    # filename IS the mapping. There is deliberately no none.wav. Rebuild from
    # the recordings in assets/audio/src/ with:
    #   python scripts/build_audio.py
    - assets/audio/ne/
