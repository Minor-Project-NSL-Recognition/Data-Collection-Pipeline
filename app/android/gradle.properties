org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler cannot release its cache files on this machine
# and fails :camera_android_camerax:compileDebugKotlin with
# "Could not close incremental caches in ...caches-jvm/jvm/kotlin".
# Usually a file lock from antivirus / search indexing on the build directory.
# Turning incremental compilation off costs a little rebuild time and avoids it.
# If your machine builds fine without this, delete the line.
kotlin.incremental=false
