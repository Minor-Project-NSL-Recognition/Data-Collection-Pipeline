# NSL recognition backend, published through the persistent Cloudflare tunnel.
#
#   docker compose up -d                   # server + https://nsl.singhdipesh.com.np
#   docker compose --profile quick up -d   # server + a throwaway *.trycloudflare.com URL
#
# Copy .env.example to .env first. TUNNEL_TOKEN is what binds the stack to the
# persistent hostname; NSL_API_KEY is mandatory whenever a tunnel is up, since a
# tunnel URL is reachable by anyone on the internet.

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: nsl-server
    container_name: nsl-server
    environment:
      NSL_MAX_SESSIONS: ${NSL_MAX_SESSIONS:-4}
      NSL_API_KEY: ${NSL_API_KEY:-}
      # Empty = the threshold fitted at training time. See .env.example.
      NSL_OOD_THRESHOLD: ${NSL_OOD_THRESHOLD:-}
    ports:
      # Also published on the LAN, so the phone can fall back to a direct
      # connection if the tunnel misbehaves mid-demo.
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  # --- The persistent hostname: nsl.singhdipesh.com.np ----------------------
  # Default, no profile: bringing the stack up puts the server on its real URL.
  #
  # This tunnel is remotely managed, so its ingress rule lives in the Cloudflare
  # dashboard and points at http://localhost:8000. `network_mode: service:server`
  # makes that resolve here: the connector shares the server container's network
  # namespace, so its localhost IS the server. Do not give this service its own
  # ports or networks -- compose rejects both under network_mode.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: nsl-tunnel
    # Plain ${VAR:-} on purpose. A ${TUNNEL_TOKEN:?...} guard would abort the
    # whole file at interpolation time, including LAN-only use; a missing token
    # surfaces as a cloudflared login error in this one container instead.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    network_mode: "service:server"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  # --- Zero setup, ephemeral URL -------------------------------------------
  # Escape hatch for when the account/DNS side is unavailable. The hostname is
  # random and changes on every restart, so a baked-in APK cannot reach it and
  # `./scripts/tunnel_url.sh` must be re-read each time. Testing only.
  tunnel-quick:
    image: cloudflare/cloudflared:latest
    container_name: nsl-tunnel-quick
    profiles: ["quick"]
    command: tunnel --no-autoupdate --url http://server:8000
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
